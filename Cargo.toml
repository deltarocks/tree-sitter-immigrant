[package]
name = "tree-sitter-immigrant"
description = "immigrant grammar for tree-sitter"
version = "0.0.1"
license = "MIT OR Apache-2.0"
keywords = ["incremental", "parsing", "tree-sitter", "immigrant"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/deltarocks/tree-sitter-immigrant"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "README.adoc"
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
